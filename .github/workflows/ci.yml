name: offline-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,serve]"
      - run: pytest --cov=agentlab --cov-report=term-missing --cov-fail-under=90
      - run: python -m compileall -q src tests scripts
      - run: ruff check src tests scripts
      - run: mypy src
      - run: python -m build
      - run: python scripts/check_package_contents.py dist
      - run: agentlab --help
