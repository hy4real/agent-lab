[project]
name = "agent-lab"
version = "1.3.0"
description = "Provider-agnostic local evidence research agent and runtime experiments"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.28",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "pytest-socket>=0.7",
  "qdrant-client>=1.18,<2",
  "ruff>=0.6",
]
eval = ["openai>=1.0"]
live = ["openai>=1.0"]
rag = ["qdrant-client>=1.18,<2", "fastembed>=0.8,<0.9"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
agentlab = "agentlab.cli:main"

[project.urls]
Repository = "https://github.com/hy4real/agent-lab"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentlab"]

[tool.hatch.build.targets.sdist]
include = [
  "/.dockerignore",
  "/.github/workflows/ci.yml",
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/README.md",
  "/SECURITY.md",
  "/docs",
  "/evals",
  "/example",
  "/pyproject.toml",
  "/scripts",
  "/src",
  "/tests",
]
exclude = ["**/__pycache__", "**/*.pyc", "**/*.egg-info"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--disable-socket --allow-unix-socket"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
  "fastapi",
  "fastapi.*",
  "numpy",
  "numpy.*",
  "openai",
  "openai.*",
  "pydantic",
  "pydantic.*",
  "starlette",
  "starlette.*",
]
follow_imports = "skip"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
